<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klassisches Snake Spiel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <h1>SNAKE</h1>

        <div class="scoreboard">
            <div class="score-item">Score: <span id="currentScore">0</span></div>
            <div class="score-item">Highscore: <span id="highScore">0</span></div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <div id="overlay" class="overlay">
                <h2 id="overlayTitle">SNAKE GAME</h2>
                <p id="overlayText">Klicke auf "Spiel starten" um loszulegen!</p>
            </div>
        </div>

        <div class="controls-panel">
            <div class="settings-group">
                <label for="wallMode">Wand-Mechanik:</label>
                <select id="wallMode">
                    <option value="die">Tödliche Wände (Klassisch)</option>
                    <option value="wrap">Durchgleiten (Wrap-Around)</option>
                </select>
            </div>

            <div class="btn-group">
                <button id="startBtn">Spiel starten</button>
                <button id="pauseBtn" class="secondary" disabled>Pause</button>
            </div>
        </div>

        <div class="instructions">
            <p><strong>Steuerung:</strong> Pfeiltasten oder WASD zum Lenken.</p>
            <p><strong>Pause:</strong> Leertaste</p>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
